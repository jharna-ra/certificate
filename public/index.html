<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICES Certificate Verification</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#5d6b7a;--ok:#0a7d3b;--bad:#b3261e;--ln:#e1e6eb}
@media(prefers-color-scheme:dark){:root{--bg:#12171d;--card:#1b222a;--tx:#e8edf2;--mu:#9aa7b4;--ok:#4cc380;--bad:#ff7b72;--ln:#2c3640}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:20px}
.c{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:24px}
h1{font-size:18px;margin:0 0 16px;color:var(--mu);font-weight:600}
.s{font-size:22px;font-weight:700;margin-bottom:16px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.r{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--ln)}
.r span:first-child{color:var(--mu)}.r span:last-child{text-align:right;font-weight:600}
</style></head><body><div class="c"><h1>ICES Certificate Verification</h1><div id="o" class="s">Checking…</div><div id="d"></div></div>
<script>
const PUB="BFbnKESe4QV7xv-Lge9PX_W0u3ZYO2KzFV6JgFUF2YkrnQBcl5ylqqT3d6E0erqGV6sGS7UkfmiGTKq9KpfleoA";
const CB={"order":["Cert","Name","Aadhar","DOB","Enroll","Job","Duration","Center","Dist","State","Partner","Place","Grade","Date"],"book":{"Job":["Beauty Therapist"],"Duration":["510 Hours"],"Center":["Acme Education Solution Pvt. Ltd."],"Dist":["Ranchi"],"State":["Jharkhand"],"Partner":["Skills Mantra Edutech Consulting India Pvt. Ltd."],"Place":["Ludhiana, Punjab"]}};
const L={Cert:"Certificate No.",Name:"Name",Aadhar:"Aadhaar",DOB:"Date of Birth",Enroll:"Enrollment",Job:"Job Role",Duration:"Duration",Center:"Training Centre",Dist:"District",State:"State",Partner:"Partner",Place:"Place",Grade:"Grade",Date:"Issue Date"};
const u8=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
function show(ok,msg,rows){const o=document.getElementById("o");o.textContent=msg;o.className="s "+(ok?"ok":"bad");
document.getElementById("d").innerHTML=(rows||[]).map(([k,v])=>'<div class="r"><span></span><span></span></div>').join("");
[...document.querySelectorAll("#d .r")].forEach((e,i)=>{e.children[0].textContent=rows[i][0];e.children[1].textContent=rows[i][1]})}
(async()=>{try{
const [p,s]=location.hash.slice(1).split(".");if(!p||!s)throw 0;
const data=u8(p),sig=u8(s);
const key=await crypto.subtle.importKey("raw",u8(PUB),{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,sig,data))throw 0;
const txt=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
let f={},rows;
if(txt.startsWith("RAW:")){const kv=txt.slice(4).split("|").map(x=>{const i=x.indexOf(":");return[x.slice(0,i),x.slice(i+1)]});kv.forEach(([k,v])=>f[k]=v);rows=kv.map(([k,v])=>[L[k]||k,v])}
else{const a=txt.split("|");CB.order.forEach((k,i)=>{let v=a[i]||"";if(v[0]==="#")v=(CB.book[k]||[])[+v.slice(1)]||v;f[k]=v});rows=Object.keys(L).filter(k=>f[k]).map(k=>[L[k],f[k]])}
let rev=null;try{const j=await (await fetch("/revoked.json",{cache:"no-store"})).json();rev=j[f.Cert]||null}catch(e){}
if(rev)show(false,"Certificate REVOKED"+(rev===true?"":": "+rev),rows);else show(true,"✔ Genuine Certificate",rows);
}catch(e){show(false,"✘ Invalid or tampered certificate",[])}})();
</script></body></html>
