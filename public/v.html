<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f6f8">
<title>ICES Certificate Verification</title>

<style>
:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #202b38;
  --muted: #64748b;
  --border: #e2e8f0;
  --green: #16803c;
  --red: #c62828;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 14px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  max-width: 680px;
  margin: 20px auto;
  padding: 26px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 5px 22px rgba(0,0,0,.05);
}

.logo {
  display: block;
  width: 84px;
  height: 84px;
  margin: 0 auto 12px;
  object-fit: contain;
}

h1 {
  font-size: 21px;
  margin: 0 0 8px;
  text-align: center;
}

.subtitle {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 25px;
  text-align: center;
}

.status {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 20px;
  text-align: center;
}

.success {
  color: var(--green);
}

.error {
  color: var(--red);
}

.details {
  display: none;
}

.item {
  display: grid;
  grid-template-columns: 42% 58%;
  gap: 12px;
  padding: 12px 0;
  border-top: 1px solid var(--border);
}

.label {
  color: var(--muted);
  font-size: 14px;
}

.value {
  text-align: right;
  font-weight: 600;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.footer {
  color: var(--muted);
  text-align: center;
  font-size: 12px;
  margin-top: 24px;
}

@media(max-width: 480px) {
  .container {
    padding: 19px;
  }

  .item {
    grid-template-columns: 1fr;
    gap: 5px;
  }

  .value {
    text-align: left;
  }
}
</style>
</head>

  <h1>Integrated Council for Entrepreneurship and Skilling</h1>

  <div class="subtitle">
    An Awarding Body Recognised by NCVET
  </div>

  <div id="status" class="status">
    Verifying certificate...
  </div>

  <div id="details" class="details"></div>

  <div class="footer">
    ICES Certificate Verification System
  </div>

</main>

<script>
"use strict";

/*
 IMPORTANT:
 This must be the SAME public key used by your existing
 QR signing system. Do not generate a new key.
*/

const PUBLIC_KEY =
"BFbnKESe4QV7xv-Lge9PX_W0u3ZYO2KzFV6JgFUF2YkrnQBcl5ylqqT3d6E0erqGV6sGS7UkfmiGTKq9KpfleoA";


/*
 FIELD_ORDER is the order the values are stored inside the QR.
 NEVER change it: old QR codes depend on it. New fields may only
 be added at the END.
*/
const FIELD_ORDER = [
  "Cert",
  "Name",
  "Aadhar",
  "DOB",
  "Enroll",
  "Job",
  "Duration",
  "Center",
  "Dist",
  "State",
  "Partner",
  "Place",
  "Grade",
  "Date"
];

/*
 DISPLAY_ORDER only controls the order shown on this page.
 It does not affect how QR codes are read.
*/
const DISPLAY_ORDER = [
  "Cert",
  "Name",
  "Aadhar",
  "Father",
  "DOB",
  "Enroll",
  "Job",
  "Duration",
  "Center",
  "Dist",
  "State",
  "Partner",
  "Grade",
  "Place",
  "Date"
];

const FIELD_LABELS = {
  Cert: "Certificate No",
  Name: "Name",
  Aadhar: "Aadhar No",
  Father: "Son / Daughter of",
  DOB: "DOB",
  Enroll: "Enrollment",
  Job: "Job Role",
  Duration: "Duration",
  Center: "Training Centre",
  Dist: "District",
  State: "State",
  Partner: "Assessment Partner",
  Place: "Place of Issue",
  Grade: "Grade",
  Date: "Date of Issue"
};


/*
 Dictionary values below are based on the supplied
 Suchita Tirkey QR payload.

 These mappings must match the original QR generator
 for every certificate.
*/

const DICTIONARY = {
  Job: [
    "Sampling Tailor"
  ],

  Duration: [
    "420 Hours"
  ],

  Center: [
    "Acme Education Solution Pvt. Ltd."
  ],

  Dist: [
    "Ranchi"
  ],

  State: [
    "Jharkhand"
  ],

  Partner: [
    "Skills Mantra Edutech Consulting India Pvt. Ltd."
  ],

  Place: [
    "Ludhiana, Punjab"
  ]
};


function decodeBase64URL(value) {

  let s = value
    .replace(/-/g, "+")
    .replace(/_/g, "/");

  s += "=".repeat((4 - s.length % 4) % 4);

  const binary = atob(s);

  const result = new Uint8Array(binary.length);

  for (let i = 0; i < binary.length; i++) {
    result[i] = binary.charCodeAt(i);
  }

  return result;
}


function displayStatus(message, type) {

  const element = document.getElementById("status");

  element.textContent = message;

  element.className =
    "status " + (type === "success" ? "success" : "error");
}


function displayDetails(fields) {

  const container = document.getElementById("details");

  container.replaceChildren();

  DISPLAY_ORDER.forEach(key => {

    const value = fields[key];

    if (value === undefined || value === null || value === "") {
      return;
    }

    const row = document.createElement("div");
    row.className = "item";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = FIELD_LABELS[key];

    const data = document.createElement("div");
    data.className = "value";
    data.textContent = value;

    row.appendChild(label);
    row.appendChild(data);

    container.appendChild(row);

  });

  container.style.display = "block";
}


function parseCandidateData(text) {

  const fields = {};

  if (text.startsWith("RAW:")) {

    text.substring(4).split("|").forEach(part => {

      const index = part.indexOf(":");

      if (index < 0) return;

      const key = part.substring(0, index);
      const value = part.substring(index + 1);

      fields[key] = value;

    });

    return fields;
  }

  const values = text.split("|");

  FIELD_ORDER.forEach((key, index) => {

    let value = values[index] || "";

    if (value.startsWith("#")) {

      const dictionaryIndex = Number(value.substring(1));

      const options = DICTIONARY[key] || [];

      value = options[dictionaryIndex] ?? value;
    }

    fields[key] = value;

  });

  return fields;
}


async function checkRevocation(certificateNumber) {

  try {

    const response = await fetch("/revoked.json", {
      cache: "no-store"
    });

    if (!response.ok) return null;

    const records = await response.json();

    return records[certificateNumber] || null;

  } catch (error) {

    console.warn("Revocation check unavailable:", error);

    return null;
  }
}


async function verifyCertificate() {

  try {

    if (!location.hash || location.hash.length < 5) {
      throw new Error("Certificate QR data is missing.");
    }

    const parts = location.hash.substring(1).split(".");

    if (parts.length !== 2 || !parts[0] || !parts[1]) {
      throw new Error("Invalid QR link format.");
    }

    const compressedData = decodeBase64URL(parts[0]);

    const signature = decodeBase64URL(parts[1]);


    const publicKey = await crypto.subtle.importKey(

      "raw",

      decodeBase64URL(PUBLIC_KEY),

      {
        name: "ECDSA",
        namedCurve: "P-256"
      },

      false,

      ["verify"]

    );


    const signatureValid = await crypto.subtle.verify(

      {
        name: "ECDSA",
        hash: "SHA-256"
      },

      publicKey,

      signature,

      compressedData

    );


    if (!signatureValid) {
      throw new Error("Certificate signature is invalid.");
    }


    const decompressedStream = new Blob([
      compressedData
    ]).stream().pipeThrough(
      new DecompressionStream("deflate-raw")
    );


    const candidateText = await new Response(
      decompressedStream
    ).text();


    const candidate = parseCandidateData(candidateText);


    if (!candidate.Cert || !candidate.Name) {
      throw new Error("Candidate information is incomplete.");
    }


    displayDetails(candidate);


    const revoked = await checkRevocation(candidate.Cert);


    if (revoked) {

      displayStatus(
        "Certificate REVOKED",
        "error"
      );

    } else {

      displayStatus(
        "✓ Genuine Certificate",
        "success"
      );

    }

  } catch (error) {

    console.error("ICES verification error:", error);

    document.getElementById("details").style.display = "none";

    displayStatus(
      "Unable to verify certificate: " + error.message,
      "error"
    );

  }

}


verifyCertificate();

</script>
