
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICES Certificate Verification</title>

<style>
:root {
  --bg: #f4f6f8;
  --card: #fff;
  --tx: #1b2430;
  --mu: #5d6b7a;
  --ok: #0a7d3b;
  --bad: #b3261e;
  --ln: #e1e6eb;
}
@media(prefers-color-scheme:dark) {
  :root {
    --bg:#12171d;
    --card:#1b222a;
    --tx:#e8edf2;
    --mu:#9aa7b4;
    --ok:#4cc380;
    --bad:#ff7b72;
    --ln:#2c3640;
  }
}
body {
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font:16px system-ui,sans-serif;
  padding:20px;
}
.c {
  max-width:560px;
  margin:0 auto;
  background:var(--card);
  border:1px solid var(--ln);
  border-radius:12px;
  padding:24px;
}
h1 {
  font-size:18px;
  margin:0 0 16px;
  color:var(--mu);
  font-weight:600;
}
.s {
  font-size:22px;
  font-weight:700;
  margin-bottom:16px;
}
.ok {color:var(--ok)}
.bad {color:var(--bad)}
.r {
  display:flex;
  justify-content:space-between;
  gap:16px;
  padding:9px 0;
  border-top:1px solid var(--ln);
}
.r span:first-child {color:var(--mu)}
.r span:last-child {
  text-align:right;
  font-weight:600;
  overflow-wrap:anywhere;
}
</style>
</head>

<body>
<div class="c">
  <h1>Integrated Council for Entrepreneurship and Skilling</h1>
  <p>An Awarding Body Recognised by NCVET</p>
  <div id="o" class="s">Checking certificate...</div>
  <div id="d"></div>
</div>

<script>
const PUB =
"BFbnKESe4QV7xv-Lge9PX_W0u3ZYO2KzFV6JgFUF2YkrnQBcl5ylqqT3d6E0erqGV6sGS7UkfmiGTKq9KpfleoA";

const CB = {
  order: [
    "Cert","Name","Aadhar","DOB","Enroll",
    "Job","Duration","Center","Dist","State",
    "Partner","Place","Grade","Date"
  ],
  book: {
    Job: ["Beauty Therapist"],
    Duration: ["510 Hours"],
    Center: ["Acme Education Solution Pvt. Ltd."],
    Dist: ["Ranchi"],
    State: ["Jharkhand"],
    Partner: ["Skills Mantra Edutech Consulting India Pvt. Ltd."],
    Place: ["Ludhiana, Punjab"]
  }
};

const LABELS = {
  Cert: "Certificate No.",
  Name: "Candidate Name",
  Aadhar: "Aadhaar Number",
  DOB: "Date of Birth",
  Enroll: "Enrollment",
  Job: "Job Role",
  Duration: "Duration",
  Center: "Training Centre",
  Dist: "District",
  State: "State",
  Partner: "Assessment Partner",
  Grade: "Grade",
  Place: "Place of Issue",
  Date: "Date of Issue"
};

const u8 = s => {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  s += "=".repeat((4 - s.length % 4) % 4);
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
};

function show(ok, msg, rows) {
  const o = document.getElementById("o");
  o.textContent = msg;
  o.className = "s " + (ok ? "ok" : "bad");

  const d = document.getElementById("d");
  d.replaceChildren();

  (rows || []).forEach(([key, value]) => {
    const r = document.createElement("div");
    r.className = "r";

    const k = document.createElement("span");
    k.textContent = key;

    const v = document.createElement("span");
    v.textContent = value;

    r.append(k, v);
    d.appendChild(r);
  });
}

(async () => {
  try {
    const parts = location.hash.slice(1).split(".");
    const p = parts[0];
    const s = parts[1];

    if (!p || !s) {
      throw new Error("Missing certificate data.");
    }

    const data = u8(p);
    const sig = u8(s);

    const key = await crypto.subtle.importKey(
      "raw",
      u8(PUB),
      {
        name: "ECDSA",
        namedCurve: "P-256"
      },
      false,
      ["verify"]
    );

    const valid = await crypto.subtle.verify(
      {
        name: "ECDSA",
        hash: "SHA-256"
      },
      key,
      sig,
      data
    );

    if (!valid) {
      throw new Error("Invalid signature.");
    }

    const txt = await new Response(
      new Blob([data]).stream().pipeThrough(
        new DecompressionStream("deflate-raw")
      )
    ).text();

    let f = {};

    if (txt.startsWith("RAW:")) {
      const kv = txt.slice(4).split("|").map(x => {
        const i = x.indexOf(":");
        return [x.slice(0, i), x.slice(i + 1)];
      });

      kv.forEach(([k, v]) => f[k] = v);

    } else {
      const a = txt.split("|");

      CB.order.forEach((k, i) => {
        let v = a[i] || "";

        if (v[0] === "#") {
          v = (CB.book[k] || [])[Number(v.slice(1))] || v;
        }

        f[k] = v;
      });
    }

    const rows = CB.order
      .filter(k => f[k] !== undefined && f[k] !== "")
      .map(k => [LABELS[k] || k, f[k]]);

    let revoked = null;

    try {
      const response = await fetch("/revoked.json", {
        cache: "no-store"
      });

      if (response.ok) {
        const j = await response.json();
        revoked = j[f.Cert] || null;
      }
    } catch (e) {}

    if (revoked) {
      show(
        false,
        "Certificate REVOKED" +
        (revoked === true ? "" : ": " + revoked),
        rows
      );
    } else {
      show(true, "✔ Genuine Certificate", rows);
    }

  } catch (e) {
    show(
      false,
      "✘ Unable to verify certificate",
      []
    );
  }
})();
</script>
</body>
</html>
